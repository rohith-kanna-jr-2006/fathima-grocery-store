<!-- Login Action and Micro-interaction Script -->
<script>
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            const icon = input.parentElement.querySelector('.material-symbols-outlined');
            if (icon) icon.style.color = '#006b2c';
        });
        input.addEventListener('blur', () => {
            const icon = input.parentElement.querySelector('.material-symbols-outlined');
            if (icon) icon.style.color = '#6e7b6c';
        });
    });

    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');
    if (togglePasswordBtn && passwordInput && toggleIcon) {
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
    }

    const loginForm = document.getElementById('login-form');
    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('login-submit-btn');
            const btnText = document.getElementById('btn-text');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                if (typeof showToast === 'function') {
                    showToast('Please enter both username and password', 'error');
                } else {
                    alert('Please enter both username and password');
                }
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (typeof showToast === 'function') {
                        showToast('Login successful! Redirecting...', 'success');
                    }
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Sign In to Portal';
                    if (typeof showToast === 'function') {
                        showToast(data.message || 'Invalid username or password', 'error');
                    } else {
                        alert(data.message || 'Invalid credentials');
                    }
                }
            } catch (err) {
                console.error('Login error:', err);
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In to Portal';
                if (typeof showToast === 'function') {
                    showToast('Unable to connect to server. Please try again.', 'error');
                }
            }
        });
    }
</script>
